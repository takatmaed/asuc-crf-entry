<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 通信を一切許可しない（外部への送信・読み込みをブラウザが止める）。v04：Web版で同じ場所のホーム画面用設定・オフライン用の仕組み・アイコンだけ読めるようにした（外部への送信は引き続き不可） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>ASUC 症例入力</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2430;--sub:#5b6575;--line:#d9dee6;--accent:#1f5fbf;--empty:#fdecec;--emptyline:#d64545;--miss:#eceff3;--warn:#fff6d6;--warnline:#c99a00;--ok:#2e7d4f;--err:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{position:sticky;top:0;z-index:20;background:#1d2a3f;color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:600}
header .ver{font-size:12px;opacity:.75}
header .spacer{flex:1}
header input{width:9em}
button{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
header button{border-color:#4a5a75}
#status{font-size:12px;opacity:.85}
.layout{display:flex;min-height:calc(100vh - 48px)}
aside{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto;max-height:calc(100vh - 48px);position:sticky;top:48px}
aside .case{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 8px}
aside .case.active{border-color:var(--accent);background:#eaf1fc}
aside .case small{display:block;color:var(--sub)}
.badge{display:inline-block;min-width:1.6em;padding:0 6px;border-radius:10px;font-size:12px;text-align:center;background:var(--emptyline);color:#fff}
.badge.zero{background:var(--ok)}
.badge.warn{background:var(--warnline)}
main{flex:1;padding:12px 16px 80px;min-width:0}
.casebar{position:sticky;top:48px;z-index:10;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.casebar .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.summary{font-size:14px}
.summary b{font-size:16px}
nav.sections{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
nav.sections button{padding:3px 8px;font-size:13px}
section.grp{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:12px 0;padding:6px 12px}
section.grp h2{font-size:15px;margin:6px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.field{display:grid;grid-template-columns:minmax(180px,38%) 1fr auto;gap:4px 10px;align-items:start;padding:7px 8px;border-left:4px solid transparent;border-bottom:1px solid #f0f2f5}
.field .lab{font-weight:600;font-size:14px}
.field .lab code{display:block;font-weight:400;font-size:11px;color:var(--sub)}
.field .help{grid-column:2 / 4;font-size:12px;color:var(--sub)}
.field .msg{grid-column:2 / 4;font-size:13px}
.field.st-empty{background:var(--empty);border-left-color:var(--emptyline)}
.field.st-missing{background:var(--miss);border-left-color:#9aa4b2}
.field.st-warn{background:var(--warn);border-left-color:var(--warnline)}
.field.st-error{background:var(--empty);border-left-color:var(--err)}
.field.st-error .msg{color:var(--err);font-weight:600}
.field.st-warn .msg{color:#7a5d00}
.field.calc{background:#f7f8fa}
.field.calc .val{font-variant-numeric:tabular-nums;color:#334}
.field.hiddenf{display:none}
body.only-empty .field:not(.st-empty):not(.st-error){display:none}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctl input[type=text]{font:inherit;padding:5px 8px;border:1px solid #b9c1cc;border-radius:6px;width:12em;max-width:100%}
.ctl input.wide{width:22em}
.ctl input[type=date]{width:2.4em;padding:3px;border:1px solid #b9c1cc;border-radius:6px;color:transparent;background:#fff}
.opts{display:flex;flex-wrap:wrap;gap:4px;outline:none;border-radius:6px;padding:2px}
.opts:focus{box-shadow:0 0 0 2px var(--accent)}
.opts button{padding:4px 10px}
.opts button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.missbtn{font-size:12px;padding:3px 8px;color:var(--sub);justify-self:start;align-self:start}
.missbtn.on{background:#5b6575;color:#fff;border-color:#5b6575}
.checks{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:12px 0}
.checks li{margin:2px 0}
.checks .ok{color:var(--ok);font-weight:600}
.legend{font-size:12px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle;border-left:4px solid}
.legend .l-empty::before{background:var(--empty);border-color:var(--emptyline)}
.legend .l-miss::before{background:var(--miss);border-color:#9aa4b2}
.legend .l-warn::before{background:var(--warn);border-color:var(--warnline)}
dialog{border:1px solid var(--line);border-radius:10px;max-width:640px;width:92vw}
dialog pre{white-space:pre-wrap;font:inherit;font-size:14px;max-height:50vh;overflow:auto}
dialog .btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.empty-state{padding:40px;text-align:center;color:var(--sub)}
@media (max-width:820px){
  .layout{display:block}
  aside{width:auto;position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line)}
  aside .case{display:inline-block;width:auto;margin:3px}
  .field{grid-template-columns:1fr}
  .field .help,.field .msg{grid-column:1}
  .casebar{top:0;position:static}
}
</style>
</head>
<body>
<header>
  <h1>ASUC 症例入力</h1><span class="ver" id="ver"></span>
  <span class="spacer"></span>
  <label style="font-size:13px">入力者 <input type="text" id="inputter" placeholder="名前（ファイル名用）"></label>
  <button id="btnSave" class="primary" title="このPCのブラウザに保存（入力中も自動で保存されます）">保存</button>
  <button id="btnExport" title="フォームv6のExcelに値を入れて書き出します">Excelに出力</button>
  <button id="btnImport" title="v6（またはv5）のExcel（自分や他の入力者のファイル）を読み込みます">Excelを読み込み</button>
  <button id="btnMore">その他</button>
  <span id="status"></span>
</header>
<div class="layout">
  <aside>
    <button id="btnNew" class="primary" style="width:100%">＋ 新しい症例</button>
    <div style="margin:8px 0 2px;font-size:12px;color:var(--sub)" id="caseCount"></div>
    <div style="margin:0 0 4px;font-size:12px" id="fileInfo"></div>
    <div id="caseList"></div>
  </aside>
  <main id="main"></main>
</div>
<input type="file" id="fileXlsx" accept=".xlsx" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<dialog id="dlg"><h3 id="dlgTitle"></h3><pre id="dlgBody"></pre><div class="btns" id="dlgBtns"></div></dialog>

const STORE_KEY = "asuc_crf_entry_" + SCHEMA.form_version;

const COMPAT_VERSIONS = SCHEMA.compat_form_versions || [];

// ===================== 値の変換 =====================
const z2h = s => String(s).replace(/[０-９Ａ-Ｚａ-ｚ．／]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
function toSerial(iso){ const [y,m,d] = iso.split("-").map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 86400000); }
function fromSerial(n){ const t = new Date(Date.UTC(1899,11,30) + Math.round(n) * 86400000); return t.toISOString().slice(0,10); }
function parseDate(raw){
  let s = z2h(raw).trim().replace(/[年月\.\/]/g, "-").replace(/日$/, "");
  let m = s.match(/^(\d{4})(\d{2})(\d{2})$/) || s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const t = new Date(Date.UTC(y, mo-1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo-1 || t.getUTCDate() !== d) return null;
  return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
}
function parseNum(raw){
  let s = z2h(raw).trim().replace(/[ー－−‐]/g, "-").replace(/，/g, ",");
  // カンマは正しい3桁区切り（1,234 や 12,345.6）だけ認める。6,5 や 1,2,3 は数値にしない
  if (s.includes(",")){ if (!/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return null; s = s.replace(/,/g, ""); }
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s) || s.replace(/\D/g, "").length > 15) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
const blank = v => v === undefined || v === null || v === "";

// 1項目の値を検証する。戻り値 {value, level:'ok'|'warn'|'error', msg}
function validate(col, raw, values){
  if (blank(raw)) return {value: "", level: "ok", msg: ""};
  const k = col.kind;
  if (k === "date"){
    const iso = parseDate(raw);
    if (!iso) return {value: String(raw), level: "error", msg: "日付として読めません。例 20180510 または 2018-05-10"};
    const r = col.date;
    if (iso < r.lo || iso > r.hi){
      return {value: iso, level: r.warn ? "warn" : "error",
        msg: r.warn ? `対象期間（${r.lo}〜${r.hi}）の外です。正しければこのままで構いません` : `${r.lo}〜${r.hi}の日付を入力してください`};
    }
    return {value: iso, level: "ok", msg: ""};
  }
  if (k === "int" || k === "num"){
    const n = parseNum(raw);
    if (n === null) return {value: String(raw), level: "error", msg: "数値で入力してください"};
    if (k === "int" && !Number.isInteger(n)) return {value: String(raw), level: "error", msg: "整数で入力してください"};
    if (col.hard && (n < col.hard.lo || n > col.hard.hi)) return {value: String(raw), level: "error", msg: `${col.hard.lo}〜${col.hard.hi}の整数を入力してください`};
    if (col.pct){
      // v6：Excelの入力規則（警告型）と同じく、範囲外・合計100超は警告にとどめ、値は残す（Excelにも出る。チェック列に表示）
      if (n < 0 || n > 100) return {value: n, level: "warn", msg: "0〜100の％か確認してください（例 65.3）。好中球数（/μL）などの絶対数や10倍の値ではありませんか。正しければこのままで構いません"};
      const asNum = x => typeof x === "number" ? x : (typeof x === "string" ? (parseNum(x) ?? 0) : 0);
      const sum = round6(["neutrophil_pct","lymphocyte_pct","monocyte_pct"].reduce((a,c) => a + (c === col.code ? n : asNum(values[c])), 0));
      if (sum > 100) return {value: n, level: "warn", msg: "好中球・リンパ球・単球の合計が100を超えます。10倍の値や絶対数になっていないか確認してください。正しければこのままで構いません"};
    }
    if (col.warn && (n < col.warn.lo || n > col.warn.hi)) return {value: n, level: "warn", msg: `${col.warn.lo}〜${col.warn.hi}の範囲外です。単位：${col.warn.unit}。正しければこのままで構いません`};
    return {value: n, level: "ok", msg: ""};
  }
  if (k === "cmvtext"){
    const s = z2h(raw).trim();
    if (!(s.includes("/") || s === "未検査")) return {value: s, level: "error", msg: "0/1、3/4 のように「/」を含む形か「未検査」で入力してください"};
    return {value: s, level: "ok", msg: ""};
  }
  if (k === "list"){
    if (!col.options.includes(raw)) return {value: String(raw), level: "error", msg: "選択肢にない値です"};
    return {value: raw, level: "ok", msg: ""};
  }
  const s = String(raw).trim();          // 研究IDなどの前後の空白は除く
  return {value: s, level: "ok", msg: ""};
}

// ===================== 自動計算（Excelの式と同じ。表示は参考、正式な値はExcelが計算） =====================
const isNum = v => typeof v === "number" && isFinite(v);

function compute(v){

  // 修正版Truelove-Witts

    const anymet = (t!==""&&t>S[4])||(pu!==""&&pu>S[5])||(hb!==""&&hb<S[6])||(c!==""&&c>S[7])||(e!==""&&e>S[8]);
    const allknown = t!==""&&pu!==""&&hb!==""&&(c!==""||e!=="");
    o.tw_met = sid==="" ? "" : (bs==="" ? "判定不能" : (bs<S[3] ? "非該当" : (anymet ? "該当" : (allknown ? "非該当" : "判定不能")))); }
  // 日本の重症度分類

    const mild15 = s!==""&&s<S[17]&&(g==="−"||g==="+")&&t!==""&&t<S[12]&&pu!==""&&pu<S[13]&&hb!==""&&hb>S[14];

  o.endo_date_offset = dd("endo_date", "index_date");
  o.uceis_total = (x.uceis_vascular===""||x.uceis_bleeding===""||x.uceis_ulcer==="") ? "" : x.uceis_vascular + x.uceis_bleeding + x.uceis_ulcer;
  o.admit_asc = (x.crp===""||x.alb===""||o.uceis_total==="") ? "" : (x.crp>=S[24]) + (x.alb<=S[25]) + (o.uceis_total>=S[27] ? 2 : (o.uceis_total>=S[26] ? 1 : 0));

}

// 小数の足し算の誤差（例 70.2+20.1+9.7 = 100.00000000000001）で境界の判定がExcelと食い違わないよう丸める
const round6 = v => Math.round(v * 1e6) / 1e6;
const PCT3 = ["neutrophil_pct","lymphocyte_pct","monocyte_pct"];
// チェック列（Excelのcheck列と同じ条件・同じ文言）。dupCountは同じ研究ID＋エピソード番号の件数。当てはまる文言の配列を返す
function checkItems(x, dupCount){
  const ne = k => x[k] !== "";
  const pctSum = round6((+x.neutrophil_pct||0)+(+x.lymphocyte_pct||0)+(+x.monocyte_pct||0));
  const small = k => typeof x[k] === "number" && x[k] > 0 && x[k] < 1;
  const items = [
    [pctSum > 100, "分画％の合計が100超"],
    [ne("neutrophil_pct") && ne("lymphocyte_pct") && ne("monocyte_pct") && pctSum < 50, "分画％の合計が50未満（絶対数を入れていないか）"],
    [ne("neutrophil_pct") && x.neutrophil_pct < 1, "好中球が1％未満（％記号付きで入れていないか）"],
    [small("lymphocyte_pct") || small("monocyte_pct"), "リンパ球か単球が1％未満（％記号付きで入れていないか）"],
    [PCT3.some(k => typeof x[k] === "number" && x[k] < 0), "分画％に負の値"],
    // アプリでは数値以外はエラーとして空欄にするため当てはまらないが、Excelのチェック列と項目をそろえておく
    [PCT3.some(k => ne(k) && typeof x[k] !== "number"), "分画％に数値以外（全角・記号を確認）"],
    [ne("lymphocyte_pct") && x.lymphocyte_pct === 0, "リンパ球0％（比が計算できない）"],
    [ne("platelet_10k") && x.platelet_10k > S[34], "血小板の単位（万/μL）を確認"],
    [ne("crp") && x.crp > S[35], "CRPの単位（mg/dL）を確認"],
    [ne("day3_crp") && x.day3_crp > S[35], "day 3 CRPの単位を確認"],
    [ne("wbc") && (x.wbc < 500 || x.wbc > 100000), "WBCの単位（/μL）を確認"],
    [ne("bloody_stool_freq") && ne("stool_freq") && x.bloody_stool_freq > x.stool_freq, "血便回数＞総排便回数"],
    [ne("birth_date") && ne("admission_date") && x.birth_date > x.admission_date, "生年月日が入院日より後"],
    [ne("index_date") && ne("admission_date") && x.index_date < x.admission_date, "基準日が入院日より前（前医で開始？）"],
    [ne("lab_date") && ne("index_date") && x.lab_date > x.index_date, "採血日が基準日より後"],
    [ne("discharge_date") && ne("admission_date") && x.discharge_date < x.admission_date, "退院日が入院日より前"],
    [ne("rescue_date") && ne("index_date") && x.rescue_date < x.index_date, "rescue開始日が基準日より前"],
    [ne("colectomy_date") && ne("index_date") && x.colectomy_date < x.index_date, "手術日が基準日より前"],
    [x.pre_steroid_oral === "なし" && ne("pre_steroid_dose_mg"), "経口ステロイド「なし」なのに用量あり"],
    [x.pre_5asa === "あり" && x.pre_5asa_intolerance === "未使用", "5-ASA使用中なのに不耐「未使用」"],
    [x.rescue === "なし" && ne("rescue_drug") && x.rescue_drug !== "該当なし", "rescue「なし」なのに薬剤あり"],
    [x.rescue === "あり" && (x.rescue_drug === "" || x.rescue_drug === "該当なし" || x.rescue_date === ""), "rescueの薬剤・開始日を入力"],
    [x.colectomy_index === "あり" && x.colectomy_date === "", "手術日を入力"],
    [ne("rescue2_drug") && x.rescue2_drug !== "該当なし" && x.rescue !== "あり", "2剤目があるのにrescue「あり」でない"],
    [ne("rescue2_drug") && x.rescue2_drug !== "該当なし" && x.rescue2_date === "", "2剤目の開始日を入力"],
    [ne("rescue2_date") && ne("rescue_date") && x.rescue2_date < x.rescue_date, "2剤目の開始日が最初のrescueより前"],

    [x.tw_met === "判定不能" || x.jp_severity === "判定不能", "重症度が判定不能（欠測）"],
    [x.ct_in_window === "範囲外", "CT日が許容範囲外"],
    [x.jp_severity === "軽症" && ((ne("crp") && x.crp > S[38]) || (ne("esr") && x.esr >= S[15])), "炎症反応のみ高値で軽症と判定（指針〈注18〉）"],
    [x.jp_severity === "重症" && x.abdominal_pain_severe === "" && ne("bloody_stool_freq") && x.bloody_stool_freq >= S[19] && ne("temp_max") && x.temp_max >= S[20] && ne("wbc") && x.wbc >= S[21], "劇症の可能性（強い腹痛を確認）"],
  ];

}
function checkText(x, dupCount){

// 重複の判定キー：出力するときと同じ正規化（研究IDは前後の空白を除き大文字小文字を区別しない、エピソード番号は数値。"01" と 1 は同じ）

// ===================== 状態と保存 =====================

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

// 外から来た症例データ（バックアップ・ブラウザ保存）を検証して作り直す：既知の列・文字列か数値だけを受け付ける
function sanitizeCases(list){
  if (!Array.isArray(list)) throw new Error("症例の一覧がありません");
  return list.map(c => {
    const n = newCase();
    const v = (c && typeof c.values === "object" && c.values) || {};
    for (const col of INPUT_COLS){ const x = v[col.code]; if (typeof x === "number" && isFinite(x)) n.values[col.code] = x; else if (typeof x === "string" && x !== "") n.values[col.code] = x.slice(0, 500); }
    const m = (c && typeof c.missing === "object" && c.missing) || {};
    for (const col of INPUT_COLS) if (m[col.code] === true && blank(n.values[col.code])) setMissing(n, col);
    if (c && typeof c.created === "string") n.created = c.created.slice(0, 40);
    if (c && typeof c.updated === "string") n.updated = c.updated.slice(0, 40);
    return n;
  });
}
// 欠測の印を付ける。v6に「不明」「未検査」の選択肢がある項目は、その値を入れる（出力の仕方を1つにそろえる）

const isMissingVal = (col, v) => !!col.missingValue && v === col.missingValue;

// 症例の中身（値と欠測の印）だけから作る指紋。保存のたびに変わる内部ID・日時は使わない（開いて閉じただけでは変わらない）
function casesHash(cases){
  const canon = (Array.isArray(cases) ? cases : []).map(c => {
    const v = (c && c.values) || {}, m = (c && c.missing) || {};
    return Object.keys(v).sort().map(k => k + "=" + JSON.stringify(v[k])).join("|") + "#" + Object.keys(m).filter(k => m[k] === true).sort().join(",");
  }).join("\n");
  let h = 0x811c9dc5;
  for (let i = 0; i < canon.length; i++){ h ^= canon.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return cases.length + ":" + h.toString(16);
}
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const d = raw ? JSON.parse(raw) : null;
    if (d){
      state.cases = sanitizeCases(d.cases || []); myRev = +d.rev || 0;
      hadCases = d.had_cases === true || state.cases.length > 0;
      if (d.compat_seen && typeof d.compat_seen === "object") for (const v of COMPAT_VERSIONS) if (typeof d.compat_seen[v] === "string") compatSeen[v] = d.compat_seen[v];
    }
    // この版で症例を一度も入れていなければ、前の版（列が同じ）のブラウザ内データを引き継ぐ（前の版のデータは消さない）。
    // この版を開いただけで空の状態が保存されていても引き継ぐ。症例を入れたことがあれば（全部削除して0件でも）自動では引き継がず、
    // 前の版の症例の中身が引き継いだ・確認した時点から変わっていれば知らせる
    for (let i = 0; i < COMPAT_VERSIONS.length; i++){
      const v = COMPAT_VERSIONS[i];
      const old = localStorage.getItem(COMPAT_KEYS[i]); if (!old) continue;
      const od = JSON.parse(old); const n = Array.isArray(od.cases) ? od.cases.length : 0; if (!n) continue;
      const hash = casesHash(sanitizeCases(od.cases));   // 前の版のアプリが読み込み時に整える形にそろえてから比べる（古い形のデータでの誤報を防ぐ）
      if (!hadCases){ state.cases = sanitizeCases(od.cases); migratedFrom = {v, n}; compatSeen[v] = hash; }
      else if (compatSeen[v] !== hash) compatChanged = {v, hash};
      break;
    }
    const meta = JSON.parse(localStorage.getItem(META_KEY) || "{}");
    document.getElementById("inputter").value = typeof meta.inputter === "string" ? meta.inputter.slice(0, 40) : "";
    lastFile = typeof meta.lastFile === "string" ? meta.lastFile.slice(0, 40) : null;
  } catch(e){ storageOK = false; }
}
function writeMeta(){ try { localStorage.setItem(META_KEY, JSON.stringify({inputter: document.getElementById("inputter").value, lastFile})); } catch(e){} }
function markFileSaved(){ lastFile = new Date().toISOString(); writeMeta(); renderList(); }
let saveTimer = null;
function save(now){
  clearTimeout(saveTimer);
  const doSave = () => {
    if (staleTab){ showStale(); return; }
    if (cleared && !state.cases.length) return;   // 消去した直後は空の状態も書き戻さない
    cleared = false;
    try {
      const cur = localStorage.getItem(STORE_KEY);
      const curRev = cur ? (+JSON.parse(cur).rev || 0) : 0;
      if (curRev !== myRev){ staleTab = true; showStale(); return; }   // 他のタブが先に保存していた
      if (cur) localStorage.setItem(PREV_KEY, cur);
      myRev = curRev + 1;
      hadCases = hadCases || state.cases.length > 0;
      localStorage.setItem(STORE_KEY, JSON.stringify({form_version: SCHEMA.form_version, app_version: SCHEMA.app_version, rev: myRev, saved: new Date().toISOString(),
        had_cases: hadCases, compat_seen: compatSeen, cases: state.cases}));
      writeMeta();
      setStatus("ブラウザに一時保存 " + new Date().toLocaleTimeString("ja-JP", {hour: "2-digit", minute: "2-digit", second: "2-digit"}));
      storageOK = true;
    } catch(e){ storageOK = false; setStatus("⚠ ブラウザに保存できません。「その他」→バックアップを書き出してください"); }
  };
  if (now) doSave(); else saveTimer = setTimeout(doSave, 400);
}
function setStatus(t){ document.getElementById("status").textContent = t; }
function showStale(){
  setStatus("⚠ 別のタブ・ウィンドウで保存されたため、このタブの変更は保存していません");
  if (document.getElementById("staleBar")) return;
  const bar = document.createElement("div"); bar.id = "staleBar";
  bar.style.cssText = "position:sticky;top:0;z-index:30;background:#b42318;color:#fff;padding:10px 14px;font-weight:600";
  bar.innerHTML = "このアプリが別のタブ・ウィンドウでも開かれ、そちらで保存されました。このタブでの変更は保存されません。<button id='btnReload' style='margin-left:10px'>最新の内容を読み込み直す</button>";
  document.body.prepend(bar);
  document.getElementById("btnReload").onclick = () => location.reload();
}
// 前の版のデータを引き継いだこと・前の版のアプリで後から保存されたことを画面の上に知らせる
function showInfoBar(id, color, html, ackLabel, onAck){
  if (document.getElementById(id)) return;
  const bar = document.createElement("div"); bar.id = id;
  bar.style.cssText = `position:sticky;top:0;z-index:29;background:${color};color:#fff;padding:10px 14px;font-weight:600`;
  bar.innerHTML = html + (ackLabel ? " <button class='ack' style='margin-left:10px'></button>" : "") + " <button class='cls' style='margin-left:10px'>閉じる</button>";
  if (ackLabel){ const b = bar.querySelector(".ack"); b.textContent = ackLabel; b.onclick = () => { if (onAck() !== false) bar.remove(); }; }
  bar.querySelector(".cls").onclick = () => bar.remove();
  document.body.prepend(bar);
}
function showMigrated(){
  if (!migratedFrom) return;
  const L = verLabel(migratedFrom.v);
  showInfoBar("migBar", "#1d4ed8", `${L}のアプリで入力していた ${migratedFrom.n} 症例を引き継ぎました。今後はこの${SCHEMA.form_label.replace(/（.*$/, "").replace("フォーム", "")}のアプリだけで入力してください（${L}のデータは念のため残しています）。`);
}
// 前の版の症例が変わっていたら知らせる。「確認した」を押すまで、開くたびに表示する（「閉じる」はこの画面で隠すだけ）
function showCompatChanged(){
  if (!compatChanged) return;
  const {v, hash} = compatChanged, L = verLabel(v);
  showInfoBar("compatBar", "#b45309", `${L}のアプリの症例が、このアプリに引き継いだ（または確認した）後に変わっています。${L}で入力した症例はここに入っていない可能性があります。${L}のアプリでExcelに出力し、このアプリの「Excelから読み込む」で取り込んでください。`,
    "確認した（今後この内容では表示しない）", () => {
      // 別のタブで保存されてこのタブが保存できないときは、確認を記録できないので、バーを残して読み込み直しを促す
      if (staleTab){ alert("このタブでは保存できない状態です。上の「最新の内容を読み込み直す」を押してから、もう一度「確認した」を押してください"); return false; }
      compatSeen[v] = hash; compatChanged = null; save(true); });
}
// 他のタブで保存されたら知らせる（前の版のアプリで症例の中身が変わった場合も知らせる）
window.addEventListener("storage", e => {
  if (e.key === STORE_KEY){
    // v04：自分の保存より古い保存の知らせは無視する。https・httpで開いたとき、再読み込みの直後に、再読み込み前のこのタブが
    // 閉じる間際に保存した知らせが届き、別のタブで保存されたと誤って判断して保存を止めていた（ファイルから開いたときは起きない）
    let rev = Infinity; try { if (e.newValue) rev = +JSON.parse(e.newValue).rev || 0; } catch(_){}
    if (rev <= myRev) return;
    staleTab = true; showStale(); return; }
  const i = COMPAT_KEYS.indexOf(e.key);
  if (i < 0 || !e.newValue) return;
  try {
    const od = JSON.parse(e.newValue); const v = COMPAT_VERSIONS[i];
    if (!Array.isArray(od.cases) || !od.cases.length) return;
    const hash = casesHash(sanitizeCases(od.cases));
    if (compatSeen[v] !== hash){ compatChanged = {v, hash}; showCompatChanged(); }
  } catch(err){}
});

// ===================== 項目の状態 =====================
function isVisible(col, c){
  if (!col.showIf) return true;
  if (!blank(c.values[col.code])) return true;            // 値がある項目は隠さない
  return col.showIf.in.includes(c.values[col.showIf.code]);
}
function fieldState(col, c){
  if (col.kind === "formula") return {st: "calc"};
  if (!isVisible(col, c)) return {st: "hidden"};
  const raw = c.values[col.code];
  if (blank(raw)){
    if (c.missing[col.code]) return {st: "missing"};
    if (col.optional) return {st: "optional"};
    return {st: "empty"};
  }
  // 「不明」「未検査」は欠測として数える（Excelにはv6の値のまま出る）
  if (isMissingVal(col, raw)) return {st: "missing", msg: `「${raw}」は欠測として数えます（Excelには「${raw}」と出ます）`};
  const r = validate(col, raw, c.values);
  return {st: r.level === "ok" ? "ok" : r.level, msg: r.msg};
}
function caseStats(c){
  const s = {empty: 0, missing: 0, error: 0, warn: 0, done: 0, optEmpty: 0, byGroup: {}};
  for (const col of INPUT_COLS){
    const f = fieldState(col, c).st;
    if (f === "hidden") continue;
    if (f === "empty"){ s.empty++; s.byGroup[col.group] = (s.byGroup[col.group]||0) + 1; }
    else if (f === "optional") s.optEmpty++;
    else if (f === "missing") s.missing++;
    else if (f === "error"){ s.error++; s.byGroup[col.group] = (s.byGroup[col.group]||0) + 1; }
    else { s.done++; if (f === "warn") s.warn++; }
  }
  return s;
}
function cleanValues(c){ // Excelへ出す値（エラー値は空）
  const out = {};
  for (const col of INPUT_COLS){ const raw = c.values[col.code]; if (blank(raw)) continue; const r = validate(col, raw, c.values); if (r.level !== "error") out[col.code] = r.value; }
  return out;
}
function caseCheck(c, dups){ const x = compute(cleanValues(c)); return checkText(x, dups[dupKey(c)] || 0); }

// ===================== 画面 =====================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function fmtVal(v, fmt){
  if (v === "" || v === undefined) return "（未計算）";
  if (typeof v !== "number") return String(v);
  if (fmt === "yyyy-mm-dd") return fromSerial(v);
  if (fmt === "#,##0") return Math.round(v).toLocaleString("ja-JP");
  const m = fmt && fmt.match(/^0(?:\.(0+))?$/);
  if (m) return v.toFixed(m[1] ? m[1].length : 0);
  return String(Math.round(v * 1000) / 1000);
}
function renderList(){
  const dups = dupCounts();
  $("caseCount").textContent = `症例 ${state.cases.length} 件（上限 ${MAX_CASES}）` + (storageOK ? "" : "　⚠ブラウザ保存不可");
  // ブラウザ内の一時保存とは別に、ファイル（Excel・バックアップ）へ最後に書き出した日時と、その後に変更した症例の数
  const changed = lastFile ? state.cases.filter(c => (c.updated || "") > lastFile).length : state.cases.length;
  const fi = $("fileInfo");
  fi.textContent = lastFile ? `ファイルへの書き出し：${new Date(lastFile).toLocaleString("ja-JP", {month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"})}` + (changed ? `（その後に変更 ${changed} 症例）` : "（その後の変更なし）")
                            : (state.cases.length ? "まだファイルに書き出していません" : "");
  fi.style.color = (state.cases.length && changed) ? "var(--err)" : "var(--sub)";
  $("caseList").innerHTML = state.cases.map((c, i) => {
    const s = caseStats(c), chk = caseCheck(c, dups);
    const name = blank(c.values.study_id) ? "（研究ID未入力）" : esc(c.values.study_id) + (blank(c.values.episode_no) ? "" : "-" + esc(c.values.episode_no));
    const badge = `<span class="badge ${s.empty + s.error ? "" : "zero"}" title="未入力・エラー">${s.empty + s.error}</span>`;
    const ck = chk === "OK" ? "" : ` <span class="badge warn" title="${esc(chk)}">!</span>`;
    return `<button class="case ${c.id === state.current ? "active" : ""}" data-id="${esc(c.id)}">${i + 1}. ${name} ${badge}${ck}<small>${esc(c.values.admission_date || "")}</small></button>`;
  }).join("");
}
function renderCase(){
  const c = state.cases.find(k => k.id === state.current);
  if (!c){ $("main").innerHTML = `<div class="empty-state">左の「＋ 新しい症例」から入力を始めてください。<br>入力内容はこのPCのブラウザに自動で保存されます。</div>`; return; }
  const groups = Object.keys(SCHEMA.groups);
  let h = `<div class="casebar"><div class="row"><span class="summary" id="summary"></span><span class="spacer" style="flex:1"></span>
    <button id="btnNextEmpty">次の未入力へ ↓</button>
    <label style="font-size:13px"><input type="checkbox" id="onlyEmpty"> 未入力だけ表示</label>
    <button id="btnDup" title="この症例を複製（同じ患者の別入院など）">複製</button>
    <button id="btnDel">この症例を削除</button></div>
    <nav class="sections" id="secnav"></nav>
    <div class="legend"><span class="l-empty">未入力</span><span class="l-miss">欠測（未測定・不明）</span><span class="l-warn">範囲外の確認</span><span>灰色の欄＝自動計算（参考表示。正式な値はExcelが計算）</span></div></div>`;
  for (const g of groups){
    h += `<section class="grp" id="grp-${g}"><h2>${esc(SCHEMA.groups[g])}</h2>`;
    for (const col of COLS.filter(k => k.group === g)) h += fieldHTML(col, c);
    h += `</section>`;
  }
  h += `<div class="checks"><b>チェック（Excelのチェック列と同じ内容）</b><ul id="checkList"></ul></div>`;
  $("main").innerHTML = h;
  document.body.classList.toggle("only-empty", false);
  bindCase(c);
  refresh(c);
}
function fieldHTML(col, c){
  const v = c.values[col.code];
  const help = (col.help && col.prompt && col.help.includes(col.prompt)) ? col.help : [col.prompt, col.help].filter(Boolean).filter((t, i, a) => a.indexOf(t) === i).join("　");
  const cd = col.code;
  const lab = `<div class="lab" id="lab-${cd}">${esc(col.label)}<code>${cd}</code></div>`;
  const helpHtml = help ? `<div class="help" id="help-${cd}">${esc(help)}</div>` : "";
  if (col.kind === "formula") return `<div class="field calc" data-code="${cd}">${lab}<div class="val" id="calc-${cd}" aria-labelledby="lab-${cd}"></div><div></div>${helpHtml}</div>`;
  const desc = `aria-describedby="${help ? `help-${cd} ` : ""}msg-${cd}"`;
  let ctl = "";
  if (col.kind === "list"){
    ctl = `<div class="opts" tabindex="0" data-code="${cd}" role="radiogroup" aria-labelledby="lab-${cd}" ${desc} title="数字キー1〜${col.options.length}で選択、0で取り消し">` +
      col.options.map((o, i) => `<button type="button" tabindex="-1" role="radio" aria-checked="${v === o}" data-v="${esc(o)}" class="${v === o ? "sel" : ""}">${i + 1}. ${esc(o)}</button>`).join("") + `</div>`;
  } else {
    const ph = col.kind === "date" ? "例 20180510" : (col.kind === "cmvtext" ? "例 0/1、3/4" : "");
    const im = (col.kind === "int" || col.kind === "num" || col.kind === "date") ? ' inputmode="decimal"' : "";
    const wide = (col.kind === "text" && cd === "note") ? " wide" : "";
    ctl = `<input type="text" class="inp${wide}" data-code="${cd}" value="${esc(blank(v) ? "" : v)}" placeholder="${ph}"${im} autocomplete="off" aria-labelledby="lab-${cd}" ${desc}>`;
    if (col.kind === "date") ctl += `<input type="date" class="picker" data-code="${cd}" tabindex="-1" title="カレンダーから選ぶ" aria-hidden="true">`;
  }
  // 欠測ボタン：Tabキーで移動でき、Space・Enterで押せる。「不明」「未検査」がある項目では、その値を入れる
  const mtitle = col.missingValue ? `未測定・不明（Excelには「${col.missingValue}」と出ます）` : "未測定・不明で値がない（欠測。Excelでは空欄、「欠測の記録」シートに記録）";
  const mlabel = col.missingValue ? `欠測（${col.missingValue}）` : "欠測";
  const on = !!c.missing[cd] || isMissingVal(col, v);
  const missBtn = col.optional ? "<span></span>" : `<button type="button" class="missbtn ${on ? "on" : ""}" data-code="${cd}" aria-pressed="${on}" title="${esc(mtitle)}">${esc(mlabel)}</button>`;
  return `<div class="field" data-code="${cd}">${lab}<div class="ctl">${ctl}</div>${missBtn}${helpHtml}<div class="msg" id="msg-${cd}" aria-live="polite"></div></div>`;
}
// codeをnewValにしたときに消える子孫項目（rescue→2剤目→2剤目の開始日など）
function childrenToClear(c, code, newVal){
  const out = [];
  for (const child of COLS.filter(k => k.showIf && k.showIf.code === code)){
    if (child.showIf.in.includes(newVal)) continue;
    if (!blank(c.values[child.code]) || c.missing[child.code]) out.push(child);
    out.push(...childrenToClear(c, child.code, ""));
  }
  return out.filter((k, i, a) => a.indexOf(k) === i);
}
function confirmClear(c, code, newVal){
  const list = childrenToClear(c, code, newVal);
  if (!list.length) return true;
  const lines = list.map(k => `・${k.label}：${blank(c.values[k.code]) ? "（欠測）" : c.values[k.code]}`).join("\n");
  return confirm(`「${BY[code].label}」を「${newVal || "空欄"}」にすると、次の入力が消えます。\n${lines}\n\nよろしいですか？（「キャンセル」で変更しません）`);
}
function setValue(c, code, raw){
  const col = BY[code];
  let val = raw;
  if (!blank(raw)){
    const r = validate(col, raw, c.values);
    val = r.value;                 // 正規化した値（日付は yyyy-mm-dd、数値は数値）。エラーは入力のまま保持
  } else val = "";
  if (blank(val)) delete c.values[code]; else { c.values[code] = val; delete c.missing[code]; }
  // 親の値が変わって子が非表示の条件になったら、子の値を消す（値が残ると矛盾になるため）
  for (const child of COLS.filter(k => k.showIf && k.showIf.code === code)){
    if (!child.showIf.in.includes(c.values[code]) && (!blank(c.values[child.code]) || c.missing[child.code])){ delete c.values[child.code]; delete c.missing[child.code]; const el = document.querySelector(`.inp[data-code="${child.code}"]`); if (el) el.value = ""; const g = document.querySelector(`.opts[data-code="${child.code}"]`); if (g) g.querySelectorAll("button").forEach(b => b.classList.remove("sel")); setValue(c, child.code, ""); }
  }
  c.updated = new Date().toISOString();
  save();
}
function bindCase(c){
  const main = $("main");
  main.querySelectorAll(".inp").forEach(el => {
    const commit = () => { const code = el.dataset.code; const before = c.values[code]; setValue(c, code, el.value); const after = c.values[code]; if (!blank(after) && String(after) !== el.value && validate(BY[code], el.value, c.values).level !== "error") el.value = after; if (before !== after) refresh(c); };
    el.addEventListener("change", commit);
    el.addEventListener("blur", commit);
    el.addEventListener("keydown", e => { if (e.key === "Enter"){ commit(); focusNext(el); e.preventDefault(); } });
  });
  main.querySelectorAll(".picker").forEach(el => el.addEventListener("change", () => {
    if (!el.value) return; const inp = main.querySelector(`.inp[data-code="${el.dataset.code}"]`); inp.value = el.value; setValue(c, el.dataset.code, el.value); refresh(c);
  }));
  main.querySelectorAll(".opts").forEach(g => {
    const code = g.dataset.code, opts = BY[code].options;
    const choose = v => { const cur = c.values[code]; const nv = (cur === v) ? "" : v; if (!confirmClear(c, code, nv)) return; markOpts(g, nv); setValue(c, code, nv); refresh(c); };
    g.addEventListener("click", e => { const b = e.target.closest("button"); if (b){ choose(b.dataset.v); g.focus(); } });
    g.addEventListener("keydown", e => {
      if (/^[1-9]$/.test(e.key) && +e.key <= opts.length){ choose(opts[+e.key - 1]); e.preventDefault(); }
      else if (e.key === "0" || e.key === "Delete" || e.key === "Backspace"){ if (!blank(c.values[code])) choose(c.values[code]); e.preventDefault(); }
      else if (e.key === "Enter"){ focusNext(g); e.preventDefault(); }
    });
  });
  main.querySelectorAll(".missbtn").forEach(b => b.addEventListener("click", () => {
    const code = b.dataset.code, col = BY[code];
    if (c.missing[code]) delete c.missing[code];
    else if (isMissingVal(col, c.values[code])) delete c.values[code];     // 「不明」「未検査」を取り消す
    else {
      if (!blank(c.values[code]) && !confirm("入力済みの値を消して「欠測」にしますか？")) return;
      if (!confirmClear(c, code, col.missingValue || "")) return;
      setMissing(c, col);
      for (const child of childrenToClear(c, code, col.missingValue || "")){ delete c.values[child.code]; delete c.missing[child.code]; }
    }
    const val = c.values[code];
    const el = main.querySelector(`.inp[data-code="${code}"]`); if (el) el.value = blank(val) ? "" : val;
    const g = main.querySelector(`.opts[data-code="${code}"]`); if (g) markOpts(g, val);
    c.updated = new Date().toISOString(); save(); refresh(c);
  }));
  $("btnNextEmpty").onclick = () => {
    const els = [...main.querySelectorAll(".field.st-empty, .field.st-error")].filter(e => e.offsetParent !== null);
    if (!els.length){ alert("未入力の項目はありません"); return; }
    const y = window.scrollY + 140;
    const next = els.find(e => e.getBoundingClientRect().top + window.scrollY > y) || els[0];
    next.scrollIntoView({block: "center"});
    const f = next.querySelector(".inp, .opts"); if (f) f.focus({preventScroll: true});
  };

const MISS_SHEET = "欠測の記録";
function missSheetXml(cases){
  const cell = (ref, v) => typeof v === "number" ? `<c r="${ref}"><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  const rows = [["入力シートの行", "研究ID", "エピソード番号", "列名", "項目（アプリで「欠測」と印を付けた項目。値はExcelでは空欄）"]];
  cases.forEach((c, i) => { for (const col of INPUT_COLS) if (c.missing[col.code] && blank(c.values[col.code])) rows.push([SCHEMA.first_row + i, c.values.study_id ?? "", c.values.episode_no ?? "", col.code, col.label]); });

function addMissSheet(files, cases){

  wb = wb.replace("</sheets>", `<sheet xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" name="${MISS_SHEET}" sheetId="${Math.max(...ids) + 1}" state="visible" r:id="${rid}"/></sheets>`);
  files["xl/workbook.xml"] = enc.encode(wb);
  let rels = dec.decode(files["xl/_rels/workbook.xml.rels"]);
  rels = rels.replace("</Relationships>", `<Relationship Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="/${part}" Id="${rid}"/></Relationships>`);

// v6テンプレートの入力セルだけに値を書き込む
async function buildXlsx(cases){
  const files = await unzip(b64ToBytes(TEMPLATE_B64).buffer);
  const path = SCHEMA.input_sheet_path;
  let xml = new TextDecoder().decode(files[path]);
  const rows = {}; cases.forEach((c, i) => rows[SCHEMA.first_row + i] = cleanValues(c));
  let written = 0;
  xml = xml.replace(/<c r="([A-Z]+)(\d+)" s="(\d+)" t="n"><\/c>/g, (all, L, R, s) => {
    const vals = rows[+R], col = COL_OF[L];
    if (!vals || !col || col.kind === "formula") return all;
    const v = vals[col.code]; if (blank(v)) return all;
    written++;
    if (col.kind === "date") return `<c r="${L}${R}" s="${s}"><v>${toSerial(v)}</v></c>`;
    if (col.kind === "int" || col.kind === "num") return `<c r="${L}${R}" s="${s}"><v>${v}</v></c>`;
    return `<c r="${L}${R}" s="${s}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  });
  // 書き込むべきセルの数と実際に書いた数が合わなければ、出力しない（テンプレートの入力セルが想定と違う）
  const expected = Object.values(rows).reduce((a, v) => a + Object.keys(v).length, 0);
  if (written !== expected) throw new Error(`書き込めないセルがありました（予定 ${expected}、実際 ${written}）。アプリかテンプレートの不具合です`);
  files[path] = new TextEncoder().encode(xml);
  addMissSheet(files, cases);
  return {blob: await zip(files), written};
}

// v6のExcelを読み込む（Excelで保存し直したファイルにも対応）
async function readXlsx(buf){

    const b = await zipGet(z, name);
    if (!b) throw new Error(`${what}がありません。v6（またはv5）のExcelファイルか確認してください`);
    total += b.length; if (total > ZIP_MAX_TOTAL) throw new Error("展開後の大きさが上限を超えます");
    const d = dp.parseFromString(dec.decode(b), "application/xml");
    if (d.getElementsByTagName("parsererror").length) throw new Error(`${what}のXMLが壊れています`);
    return d;
  };
  const wb = await xmlOf("xl/workbook.xml", "ブックの情報（workbook.xml）");
  const wpr = wb.getElementsByTagNameNS(NS, "workbookPr")[0];
  const d1904 = wpr && ["1", "true"].includes(String(wpr.getAttribute("date1904")).toLowerCase());
  const serialToIso = n => fromSerial(Math.floor(n + 1e-9) + (d1904 ? 1462 : 0));   // 時刻部分は切り捨て
  const rels = await xmlOf("xl/_rels/workbook.xml.rels", "シートの対応表（workbook.xml.rels）");
  const sheetPath = name => {
    const sh = [...wb.getElementsByTagNameNS(NS, "sheet")].find(s => s.getAttribute("name") === name); if (!sh) return null;
    const rid = sh.getAttribute("r:id") || sh.getAttributeNS(RNS, "id");
    const rel = [...rels.getElementsByTagName("Relationship")].find(r => r.getAttribute("Id") === rid); if (!rel) return null;
    const t = rel.getAttribute("Target") || ""; return t.startsWith("/") ? t.slice(1) : "xl/" + t.replace(/^\.\//, "");
  };
  const target = sheetPath("入力");

  let shared = [];

    const ss = await xmlOf("xl/sharedStrings.xml", "文字列の表（sharedStrings.xml）");
    shared = [...ss.getElementsByTagNameNS(NS, "si")].map(si => [...si.getElementsByTagNameNS(NS, "t")].filter(t => t.parentNode.localName !== "rPh").map(t => t.textContent).join(""));

    if (r !== 2 && r < SCHEMA.first_row) continue;

    else if (t === "str" || t === "b" || t === "e") v = vEl ? vEl.textContent : null;

  if (bad.length) throw new Error(`列名がフォームv6（v5と同じ列）と一致しません（${bad.slice(0, 3).map(b => b[0] + "列").join("、")}など）。別の版のファイルではありませんか`);

    if (r <= SCHEMA.last_row) continue;

    const row = grid[r]; if (!row) continue;
    const c = newCase(); let any = false;

      c.values[col.code] = v; any = true;
    }
    for (const code of (missByRow[r] || [])) if (blank(c.values[code])){ setMissing(c, BY[code]); any = true; }
    if (any){ c.source_row = r; out.push(c); }
  }
  out.ignored = ignored;
  out.settingsDiff = settingsDiff;
  return out;
}

// ファイルの保存。保存先を選べるブラウザ（Edge・Chrome）は保存ダイアログを使う（ローカルのHTMLでは、ふつうのダウンロードだとファイル名が付かないことがあるため）。
// 保存ダイアログはボタンを押した直後に開き（時間がたつとブラウザが開かせないため）、そのあとでファイルを作る。
// iPad・iPhone（保存ダイアログがない）では、ファイルを作ってから共有メニュー（「"ファイル"に保存」）かダウンロードを選んでもらう（v04）。
// 共有メニューはボタンを押した直後でないと開けないため、ファイルを作った後の確認画面のボタンで開く。
// 戻り値："saved"（書き込み完了）、"shared"（共有メニューで保存先を選んだ）、"started"（ふつうのダウンロードを開始。保存の完了は確認できない）、"cancel"
async function saveFile(name, make){
  if (window.showSaveFilePicker){
    const ext = name.slice(name.lastIndexOf("."));
    const types = ext === ".xlsx" ? [{description: "Excelファイル", accept: {"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": [".xlsx"]}}]
                                  : [{description: "バックアップ", accept: {"application/json": [".json"]}}];
    let h = null;
    try { h = await showSaveFilePicker({suggestedName: name, types}); }
    catch(e){ if (e.name === "AbortError") return "cancel"; h = null; /* 使えない場合は下のダウンロードへ */ }
    if (h){ const blob = await make(); const w = await h.createWritable(); await w.write(blob); await w.close(); return "saved"; }
  }
  const blob = await make();
  if (IS_IOS && navigator.canShare && navigator.share && typeof File === "function"){
    const file = new File([blob], name, {type: blob.type || "application/octet-stream"});
    let can = false; try { can = navigator.canShare({files: [file]}); } catch(e){}
    if (can){
      const k = await ask("ファイルを保存", `${name}\n\n「共有メニューで保存」を押し、出てきたメニューで「"ファイル"に保存」を選んで、保存する場所を決めてください。\nうまくいかないときは「ダウンロードで保存」を使います（「ファイル」アプリの「ダウンロード」に入ります）。\n\nメール等で送るときは、院内のルールに従って暗号化してから送ってください。`,
        ["共有メニューで保存", "ダウンロードで保存", "やめる"]);
      if (k === 2) return "cancel";
      if (k === 0){
        try { await navigator.share({files: [file]}); return "shared"; }
        catch(e){ if (e.name === "AbortError") return "cancel"; /* 共有できなければ下のダウンロードへ */ }
      }
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  // iPad・Safariはダウンロードの確認画面を出すため、元データをすぐに消すと保存に失敗することがある。60秒残す（v03までは2秒）
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 60000);
  return "started";
}
// 保存のあとに出す文（どの方法で保存したか）
function savedMsg(r, what, detail = ""){
  if (r === "saved") return `${what}を保存しました${detail}`;
  if (r === "shared") return `${what}を共有メニューに渡しました${detail}。選んだ場所（「ファイル」アプリなど）に保存されたか確認してください`;
  return `${what}のダウンロードを開始しました${detail}。` + (IS_IOS ? "「ファイル」アプリの「ダウンロード」に保存されたか確認してください" : "ダウンロードフォルダに保存されたか確認してください");
}
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const safeName = s => (s || "").replace(/[\\/:*?"<>|\s]/g, "").slice(0, 20);

async function doExport(){
  commitActive();
  if (!state.cases.length){ alert("症例がありません"); return; }
  if (state.cases.length > MAX_CASES){ alert(`v6の入力行は${MAX_CASES}行までです（現在 ${state.cases.length} 件）。ファイルを分けてください`); return; }
  const dups = dupCounts();
  let empty = 0, errs = [], noId = 0, dupN = 0, pctWarn = [];
  const PCT_MSG = /分画|好中球が|リンパ球か単球|リンパ球0％/;
  for (const c of state.cases){
    const s = caseStats(c); empty += s.empty;
    const hit = checkItems(compute(cleanValues(c)), dups[dupKey(c)] || 0).filter(m => PCT_MSG.test(m));
    if (hit.length) pctWarn.push(`${c.values.study_id || "（研究IDなし）"}：${hit.join("、")}`);
    if (blank(c.values.study_id)) noId++;
    if (keyOf(c.values).complete && (dups[dupKey(c)] || 0) > 1) dupN++;
    for (const col of INPUT_COLS){ const raw = c.values[col.code]; if (!blank(raw) && validate(col, raw, c.values).level === "error") errs.push(`${c.values.study_id || "（研究IDなし）"}：${col.label}「${raw}」`); }
  }
  const lines = [`症例 ${state.cases.length} 件をv6のExcelに出力します。`, `未入力 ${empty} 項目（Excelでは空欄）`];
  if (noId) lines.push(`⚠ 研究IDが空欄の症例 ${noId} 件（Excelで自動計算されません）`);
  if (dupN) lines.push(`⚠ 研究ID＋エピソード番号の重複 ${dupN} 件`);
  if (errs.length) lines.push(`⚠ エラーのある値 ${errs.length} 件は空欄で出力されます：\n  ` + errs.slice(0, 10).join("\n  ") + (errs.length > 10 ? "\n  ほか" : ""));
  if (pctWarn.length) lines.push(`⚠ 白血球分画（％）の確認が必要な症例 ${pctWarn.length} 件（値はこのまま出力され、Excelのチェック列にも出ます。絶対数・10倍の値・％記号付きでないか確認してください）：\n  ` + pctWarn.slice(0, 10).join("\n  ") + (pctWarn.length > 10 ? "\n  ほか" : ""));
  lines.push("", "出力したファイルは院内のルールに従って暗号化し、保管・送付してください。");
  if (await ask("Excelに出力", lines.join("\n"), ["出力する", "やめる"]) !== 0) return;

}
async function doImport(fileList){
  const all = []; let ignored = 0; const settingsWarn = [];
  // すべてのファイルを先に読み、1つでも読めなければ何も取り込まない
  for (const f of fileList){
    if (f.size > 30 * 1024 * 1024){ alert(`${f.name}：ファイルが大きすぎます（30MB超）。v6（またはv5）のファイルか確認してください`); return; }
    try { const cs = await readXlsx(await f.arrayBuffer()); cs.forEach(c => c.source_file = f.name); all.push(...cs); ignored += cs.ignored || 0; if (cs.settingsDiff.length) settingsWarn.push(`${f.name}：${cs.settingsDiff.slice(0, 3).join("、")}${cs.settingsDiff.length > 3 ? "ほか" : ""}`); }
    catch(e){ alert(`${f.name}：${e.message}\n（どのファイルも読み込んでいません）`); return; }
  }
  if (!all.length){ alert("読み込める症例がありませんでした"); return; }
  // 重複は「研究ID＋エピソード番号」がどちらも入っている症例だけで判定する（片方が空欄なら同じ症例か判断できないので追加する）
  const existing = new Map(state.cases.filter(c => keyOf(c.values).complete).map(c => [dupKey(c), c]));
  const seen = new Map(existing);
  let sameExisting = 0, sameInFiles = 0, incomplete = 0, lostFields = 0, changedFields = 0;
  for (const c of all){
    if (!keyOf(c.values).complete){ incomplete++; continue; }
    const k = dupKey(c), prev = seen.get(k);
    if (prev){
      if (existing.has(k)) sameExisting++; else sameInFiles++;
      for (const col of INPUT_COLS){ const a = prev.values[col.code], b = c.values[col.code]; if (!blank(a) && blank(b)) lostFields++; else if (!blank(a) && String(a) !== String(b)) changedFields++; }
    }
    seen.set(k, c);
  }
  let mode = 0;
  const msg = [`${fileList.length} ファイルから ${all.length} 症例を読み込みます。`];
  if (ignored) msg.push(`⚠ ${SCHEMA.last_row + 1}行目以降にある ${ignored} 行は読み込みません（v6の入力行は${SCHEMA.last_row}行目まで）。`);
  if (settingsWarn.length) msg.push(`⚠ 「設定」シートの値（重症度の閾値など）がv6の原本と違うファイルがあります。値は読み込みますが、このアプリで出力し直すと設定はv6の原本に戻ります。\n  ${settingsWarn.join("\n  ")}`);
  if (incomplete) msg.push(`研究IDかエピソード番号が空欄の ${incomplete} 件は、同じ症例か確かめられないため、そのまま追加します。`);
  if (sameExisting || sameInFiles){
    if (sameExisting) msg.push(`このうち ${sameExisting} 件は、すでにある症例と研究ID＋エピソード番号が同じです。`);
    if (sameInFiles) msg.push(`読み込むファイルどうしで、研究ID＋エピソード番号が同じ症例が ${sameInFiles} 件あります（「置き換える」なら後に選んだファイルの内容、「読み込まない」なら先のファイルの内容が残ります）。`);
    msg.push(`「置き換える」を選ぶと、入力済みの値が空欄になる項目が ${lostFields} 件、値が変わる項目が ${changedFields} 件あります（症例ごと置き換えます）。`);
    msg.push("読み込んだあとでも「その他」→「読み込み前の状態に戻す」で元に戻せます。");
    mode = await ask("Excelを読み込み", msg.join("\n"), ["同じ症例はファイルの内容で置き換える", "同じ症例は読み込まない", "すべて追加する（重複として残す）", "やめる"]);
    if (mode === 3) return;
  } else {
    if (await ask("Excelを読み込み", msg.join("\n"), ["読み込む", "やめる"]) !== 0) return;
  }
  keepUndo("Excelの読み込み");
  let added = 0, replaced = 0, skipped = 0;
  const index = new Map(existing);
  for (const c of all){
    const k = dupKey(c), hit = keyOf(c.values).complete && index.get(k);
    if (hit && mode === 0){ hit.values = c.values; hit.missing = c.missing; hit.source_file = c.source_file; hit.source_row = c.source_row; hit.updated = new Date().toISOString(); replaced++; }
    else if (hit && mode === 1) skipped++;
    else { state.cases.push(c); added++; if (keyOf(c.values).complete && !index.has(k)) index.set(k, c); }
  }
  if (!state.current && state.cases.length) state.current = state.cases[0].id;
  save(true); renderList(); renderCase();
  alert(`追加 ${added} 件、置き換え ${replaced} 件、読み込まず ${skipped} 件` + (ignored ? `\n${SCHEMA.last_row + 1}行目以降の ${ignored} 行は読み込んでいません` : ""));
}
